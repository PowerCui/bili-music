name: Bridge Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wallpaper-bridge
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/**'
      - '.github/workflows/bridge-windows.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    name: Build Windows Installer (unsigned)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Setup Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        shell: pwsh
        run: |
          $env:APP_VERSION = "bridge-${{ github.run_number }}"
          iscc scripts/bilimusic.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimusic-windows-setup
          path: build/artifacts/bilimusic-*-windows-setup.exe
          retention-days: 30
