name: CD Wallpaper Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cd-wallpaper
      - feat/cd-wallpaper-v2
    paths:
      - "lib/**"
      - "windows/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/**"
      - ".github/workflows/cd-wallpaper-build.yaml"

permissions:
  contents: read

concurrency:
  group: cd-wallpaper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        continue-on-error: true
        shell: bash
        run: |
          dart format --output=none --set-exit-if-changed lib test > format.log 2>&1
          grep -E "^Changed " format.log | head -n 10 | while IFS= read -r line; do echo "::error::format| $line"; done
          exit 0

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          code=$?
          echo "analyze exit code: $code"
          errors=$(grep -E "error 鈥?" analyze.log | head -n 10)
          if [ -n "$errors" ]; then
            printf '%s\n' "$errors" | while IFS= read -r line; do echo "::error::analyze| $line"; done
            exit 1
          fi
          if [ $code -ne 0 ]; then
            tail -n 10 analyze.log | while IFS= read -r line; do echo "::error::analyze| $line"; done
            exit 1
          fi

      - name: Test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter test > test.log 2>&1
          grep -E "\[E\]|Some tests failed|^[0-9]+ (test|tests) failed" test.log | head -n 10 | while IFS= read -r line; do echo "::error::test| ${line:0:380}"; done
          exit 0

  build-windows:
    name: Build Windows Installer
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch wallpaper assets
        shell: pwsh
        env:
          WALLPAPER_ASSETS_TOKEN: ${{ secrets.WALLPAPER_ASSETS_TOKEN }}
          WALLPAPER_ASSETS_REPO: PowerCui/bili-music
        run: |
          if ([string]::IsNullOrEmpty($env:WALLPAPER_ASSETS_TOKEN)) {
            Write-Output "::error::WALLPAPER_ASSETS_TOKEN secret is not set (draft-release asset pull)"
            exit 1
          }
          $headers = @("Authorization: Bearer $env:WALLPAPER_ASSETS_TOKEN", "Accept: application/vnd.github+json", "X-GitHub-Api-Version: 2022-11-28")
          $rels = curl.exe -sS -H $headers[0] -H $headers[1] -H $headers[2] "https://api.github.com/repos/$env:WALLPAPER_ASSETS_REPO/releases?per_page=100"
          $release = ($rels | ConvertFrom-Json) | Where-Object { $_.tag_name -eq "wallpaper-assets" -and $_.draft -eq $true } | Select-Object -First 1
          if ($null -eq $release) {
            Write-Output "::error::draft release with tag_name wallpaper-assets not found (releases/tags endpoint does not cover drafts; listing showed no match)"
            exit 1
          }
          $assetUrl = ($release.assets | Where-Object { $_.name -eq "wallpaper-assets.zip" } | Select-Object -First 1).url
          if ([string]::IsNullOrEmpty($assetUrl)) {
            Write-Output "::error::wallpaper-assets.zip not found on the wallpaper-assets draft release"
            exit 1
          }
          $zip = Join-Path $env:RUNNER_TEMP "wallpaper-assets.zip"
          curl.exe -sS -L -H "Authorization: Bearer $env:WALLPAPER_ASSETS_TOKEN" -H "Accept: application/octet-stream" -o $zip $assetUrl
          if ((Test-Path $zip) -eq $false -or (Get-Item $zip).Length -lt 1000000) {
            Write-Output "::error::wallpaper-assets.zip download failed or suspiciously small"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath "assets\wallpaper" -Force
          Write-Output "--- assets/wallpaper contents ---"
          Get-ChildItem "assets\wallpaper" | ForEach-Object { Write-Output $_.Name }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        id: winbuild
        continue-on-error: true
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-windows.log
          exit $LASTEXITCODE

      - name: Report Windows build errors (a)
        if: steps.winbuild.outcome == 'failure'
        shell: pwsh
        run: |
          Get-Content build-windows.log -Tail 30 | Select-Object -First 10 |
            ForEach-Object { Write-Output "::error::win-a| $($_.Trim())" }

      - name: Report Windows build errors (b)
        if: steps.winbuild.outcome == 'failure'
        shell: pwsh
        run: |
          Get-Content build-windows.log -Tail 20 | Select-Object -First 10 |
            ForEach-Object { Write-Output "::error::win-b| $($_.Trim())" }

      - name: Report Windows build errors (c)
        if: steps.winbuild.outcome == 'failure'
        shell: pwsh
        run: |
          Get-Content build-windows.log -Tail 10 |
            ForEach-Object { Write-Output "::error::win-c| $($_.Trim())" }
          exit 1

      - name: Setup Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $env:APP_VERSION = "cd-wallpaper-${{ github.run_number }}"
          iscc scripts/bilimusic.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimusic-cd-wallpaper-windows
          path: build/artifacts/bilimusic-*-windows-setup.exe
          retention-days: 1

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        id: androidbuild
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter build apk --debug --flavor production > android.log 2>&1
          exit $?

      - name: Report Android build errors (a)
        if: steps.androidbuild.outcome == 'failure'
        shell: bash
        run: |
          tr '\r' '\n' < android.log | grep -A8 "What went wrong" | head -n 10 | while IFS= read -r line; do echo "::error::android-a| ${line:0:380}"; done

      - name: Report Android build errors (b)
        if: steps.androidbuild.outcome == 'failure'
        shell: bash
        run: |
          tr '\r' '\n' < android.log | grep -n -E "error:|Execution failed|Caused by|Unsupported|major version|Could not|FAILURE:" | head -n 10 | while IFS= read -r line; do echo "::error::android-b| ${line:0:380}"; done
          exit 1

      - name: Rename APK
        run: |
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-production-debug.apk "build/artifacts/bili-music-cd-wallpaper-${{ github.run_number }}-debug.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimusic-cd-wallpaper-android
          path: build/artifacts/*.apk
          retention-days: 30

