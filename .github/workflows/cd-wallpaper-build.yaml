name: CD Wallpaper Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cd-wallpaper
    paths:
      - "lib/**"
      - "windows/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/**"
      - ".github/workflows/cd-wallpaper-build.yaml"

permissions:
  contents: read

concurrency:
  group: cd-wallpaper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        continue-on-error: true
        run: flutter test

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Setup Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $env:APP_VERSION = "cd-wallpaper-${{ github.run_number }}"
          iscc scripts/bilimusic.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimusic-cd-wallpaper-windows
          path: build/artifacts/bilimusic-*-windows-setup.exe
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk "build/artifacts/bili-music-cd-wallpaper-${{ github.run_number }}-debug.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimusic-cd-wallpaper-android
          path: build/artifacts/*.apk
          retention-days: 30
