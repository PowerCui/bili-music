name: CD Wallpaper Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cd-wallpaper
    paths:
      - "lib/**"
      - "windows/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/**"
      - ".github/workflows/cd-wallpaper-build.yaml"

permissions:
  contents: read

concurrency:
  group: cd-wallpaper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        continue-on-error: true
        shell: bash
        run: |
          dart format --output=none --set-exit-if-changed lib test > format.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do echo "::error::format| $line"; done < <(head -n 80 format.log)
          fi
          exit 0

      - name: Analyze
        continue-on-error: true
        shell: bash
        run: |
          flutter analyze > analyze.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do echo "::error::analyze| $line"; done < <(head -n 120 analyze.log)
          fi
          exit 0

      - name: Test
        continue-on-error: true
        shell: bash
        run: |
          flutter test > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do echo "::error::test| $line"; done < <(grep -E "\[E\]|Some tests failed|Expected:|Actual:" test.log | head -n 80)
          fi
          exit 0

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-windows.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content build-windows.log -Tail 120 | ForEach-Object { Write-Output "::error::winbuild| $_" }
            exit 1
          }

      - name: Setup Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $env:APP_VERSION = "cd-wallpaper-${{ github.run_number }}"
          iscc scripts/bilimusic.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimusic-cd-wallpaper-windows
          path: build/artifacts/bilimusic-*-windows-setup.exe
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.0"
          architecture: "x64"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        shell: bash
        run: |
          flutter build apk --debug > android.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -n 120 android.log | while IFS= read -r line; do echo "::error::android| $line"; done
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk "build/artifacts/bili-music-cd-wallpaper-${{ github.run_number }}-debug.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimusic-cd-wallpaper-android
          path: build/artifacts/*.apk
          retention-days: 30
